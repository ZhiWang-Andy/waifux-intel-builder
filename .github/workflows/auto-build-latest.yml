name: Build Latest WaifuX Intel Patch (Manual)

on:
  # Automatic upstream checks and builds are disabled; run manually when needed.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waifux-intel-auto-build
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      version: ${{ steps.discover.outputs.version }}
      release_tag: ${{ steps.discover.outputs.release_tag }}
      dmg_url: ${{ steps.discover.outputs.dmg_url }}
      age_seconds: ${{ steps.discover.outputs.age_seconds }}

    steps:
      - name: Discover latest official WaifuX release
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://jipika.github.io/WaifuX/appcast.xml \
            -o /tmp/waifux-appcast.xml

          python3 - <<'PY'
          import email.utils
          import os
          import time
          import xml.etree.ElementTree as ET

          appcast = ET.parse('/tmp/waifux-appcast.xml').getroot()
          item = appcast.find('./channel/item')
          if item is None:
              raise SystemExit('No <item> found in official WaifuX appcast')

          version = None
          dmg_url = None
          pub_date = None

          for child in item:
              local = child.tag.rsplit('}', 1)[-1]
              if local == 'shortVersionString' and child.text:
                  version = child.text.strip()
              elif local == 'pubDate' and child.text:
                  pub_date = child.text.strip()
              elif local == 'enclosure':
                  url = child.attrib.get('url', '').strip()
                  if url.endswith('/WaifuX.dmg') or url.endswith('WaifuX.dmg'):
                      dmg_url = url

          if not version or not dmg_url or not pub_date:
              raise SystemExit(
                  f'Could not parse appcast: version={version!r}, '
                  f'dmg_url={dmg_url!r}, pub_date={pub_date!r}'
              )

          release_dt = email.utils.parsedate_to_datetime(pub_date)
          release_epoch = int(release_dt.timestamp())
          now_epoch = int(time.time())
          age_seconds = max(0, now_epoch - release_epoch)

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'release_tag=intel-v{version}\n')
              f.write(f'dmg_url={dmg_url}\n')
              f.write(f'pub_date={pub_date}\n')
              f.write(f'age_seconds={age_seconds}\n')

          print(f'Official WaifuX version: {version}')
          print(f'Official release time:   {pub_date}')
          print(f'Release age:             {age_seconds} seconds')
          print(f'Official DMG:            {dmg_url}')
          PY

      - name: Decide whether an Intel build is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.discover.outputs.version }}
          RELEASE_TAG: ${{ steps.discover.outputs.release_tag }}
          AGE_SECONDS: ${{ steps.discover.outputs.age_seconds }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Intel patch release $RELEASE_TAG already exists. Nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( AGE_SECONDS < 3600 )); then
            WAIT_SECONDS=$((3600 - AGE_SECONDS))
            echo "WaifuX $VERSION is new, but the one-hour safety delay has not elapsed."
            echo "Approximately $WAIT_SECONDS seconds remain before this version is eligible to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git ls-remote --exit-code --tags \
            https://github.com/jipika/WaifuX.git \
            "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Upstream appcast lists WaifuX $VERSION, but tag v$VERSION is not available yet."
            echo "Run this workflow manually again after the upstream tag becomes available."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "WaifuX $VERSION has been public for at least one hour, its tag exists,"
          echo "and no matching Intel patch release exists yet. Starting Intel build."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-latest:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-15-intel

    steps:
      - name: Show Intel macOS build environment
        run: |
          set -euxo pipefail
          uname -m
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          swiftc --version

      - name: Clone matching upstream WaifuX release
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "v${VERSION}" https://github.com/jipika/WaifuX.git WaifuX
          cd WaifuX
          echo "VERSION file: $(cat VERSION)"
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"

      - name: Patch helper build targets to Intel x86_64
        run: |
          set -euxo pipefail
          cd WaifuX

          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('scripts/build-wallpaper-video-renderer.sh'),
              Path('scripts/build-wallpaperengine-cli.sh'),
          ]
          for path in files:
              text = path.read_text()
              original = text
              text = text.replace('-target arm64-apple-macosx', '-target x86_64-apple-macosx')
              if text == original:
                  raise SystemExit(
                      f'No arm64 macOS target found in {path}; upstream build script may have changed.'
                  )
              path.write_text(text)
          PY

          echo "Video renderer target:"
          grep -- '-target ' scripts/build-wallpaper-video-renderer.sh
          echo "Wallpaper Engine CLI target:"
          grep -- '-target ' scripts/build-wallpaperengine-cli.sh

      - name: Build Intel Video and Web helpers
        run: |
          set -euxo pipefail
          cd WaifuX
          chmod +x scripts/build-wallpaper-video-renderer.sh scripts/build-wallpaperengine-cli.sh
          ./scripts/build-wallpaper-video-renderer.sh
          ./scripts/build-wallpaperengine-cli.sh

      - name: Verify x86_64 outputs
        run: |
          set -euxo pipefail
          cd WaifuX
          file Resources/wallpaper-video-renderer
          file Resources/wallpaperengine-cli
          file Resources/wallpaper-video-renderer | grep -q 'x86_64'
          file Resources/wallpaperengine-cli | grep -q 'x86_64'
          lipo -archs Resources/wallpaper-video-renderer | grep -qw 'x86_64'
          lipo -archs Resources/wallpaperengine-cli | grep -qw 'x86_64'

      - name: Package Intel patch
        env:
          VERSION: ${{ needs.check-upstream.outputs.version }}
        run: |
          set -euxo pipefail
          PKG="WaifuX-Intel-Patch-v${VERSION}"
          mkdir -p "package/${PKG}"
          cp WaifuX/Resources/wallpaper-video-renderer "package/${PKG}/"
          cp WaifuX/Resources/wallpaperengine-cli "package/${PKG}/"
          printf '%s\n' "$VERSION" > "package/${PKG}/VERSION.txt"

          cat > "package/${PKG}/README.txt" <<EOF
          WaifuX Intel Video + Web helper patch
          Version: ${VERSION}
          Architecture: x86_64

          Included:
          - wallpaper-video-renderer
          - wallpaperengine-cli

          This archive is intended for use by the WaifuX Intel Auto Updater.
          Wallpaper Engine Scene is not patched.
          EOF

          chmod 755 "package/${PKG}/wallpaper-video-renderer" "package/${PKG}/wallpaperengine-cli"
          cd package
          /usr/bin/zip -r -X "../WaifuX-Intel-Patch-v${VERSION}-macOS-x86_64.zip" "$PKG"

      - name: Re-check release race before publishing
        id: race
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A matching Intel release was created while this job was building."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish matching Intel patch release
        if: steps.race.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-upstream.outputs.version }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
          DMG_URL: ${{ needs.check-upstream.outputs.dmg_url }}
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="WaifuX-Intel-Patch-v${VERSION}-macOS-x86_64.zip"
          gh release create "$RELEASE_TAG" "$ZIP" \
            --title "WaifuX Intel Video + Web Patch ${VERSION}" \
            --notes "Automatic x86_64 helper build for upstream WaifuX ${VERSION}, intentionally delayed until the official release has been public for at least one hour. Official upstream DMG: ${DMG_URL}. Includes wallpaper-video-renderer and wallpaperengine-cli only; Scene remains unsupported."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: WaifuX-Intel-Patch-v${{ needs.check-upstream.outputs.version }}
          path: WaifuX-Intel-Patch-v${{ needs.check-upstream.outputs.version }}-macOS-x86_64.zip
          if-no-files-found: error
          retention-days: 14
